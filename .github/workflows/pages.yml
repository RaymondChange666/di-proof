name: Deploy di-proof Pages

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out published branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          cp index.html curve.html _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
